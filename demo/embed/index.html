<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Kumimoji · crossword table</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}kumimoji-table{max-height:100%}</style></head><body><script type="module">
import "../dist/element-define.js";
import { KUMIMOJI_HANDS } from "../dist/index.js";
import { embedDay } from "../dist/embed-day.js";
const query=new URLSearchParams(location.search),table=document.createElement("kumimoji-table");table.setAttribute("size","medium");table.setAttribute("keep","false");
for(const[name,choices]of[["language",["english","japanese"]],["level",["easy","medium","hard"]],["length",["short","medium","full"]],["lang",["en","ja"]],["theme",["auto","light","dark"]],["size",["small","medium","large"]]])if(choices.includes(query.get(name)))table.setAttribute(name,query.get(name));
if(query.has("hand")&&Object.values(KUMIMOJI_HANDS).includes(Number(query.get("hand"))))table.setAttribute("hand",query.get("hand"));
for(const[name,min,max]of[["width",100,2000],["seed",0,4294967295]]){const value=query.get(name);if(value!==null&&/^\d+$/.test(value)&&Number(value)>=min&&Number(value)<=max)table.setAttribute(name,value);}if(query.get("seed")==="daily")table.setAttribute("seed","daily");
if(query.has("daily"))try{embedDay(query.get("daily"));table.setAttribute("daily",query.get("daily"));}catch{/* Ignore an invalid day. */}
for(const name of["diagonals","keep","controls"])if(query.has(name)&&["","true","on","1","false","off","no","0"].includes(query.get(name).trim().toLowerCase()))table.setAttribute(name,query.get(name));const label=query.get("label");if(label!==null&&label.length<=200)table.setAttribute("label",label);if(query.get("lang")==="ja")document.documentElement.lang="ja";
for(const type of["kumimoji-load","kumimoji-change","kumimoji-finish","kumimoji-error"])table.addEventListener(type,event=>{if(parent!==window)parent.postMessage({type:event.type,detail:JSON.parse(JSON.stringify(event.detail))},"*");});document.body.append(table);
</script></body></html>
